<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Video</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scene">

        <!-- CARDS - Top Row -->
        <div class="card card-1"><img src="card-img/01.png" alt="Card 1"></div>
        <div class="card card-2"><img src="card-img/02.png" alt="Card 2"></div>
        <div class="card card-3"><img src="card-img/03.png" alt="Card 3"></div>

        <!-- CARDS - Middle Left & Right -->
        <div class="card card-4"><img src="card-img/04.png" alt="Card 4"></div>
        <div class="card card-5"><img src="card-img/05.png" alt="Card 5"></div>

        <!-- CARDS - Bottom Row -->
        <div class="card card-6"><img src="card-img/06.png" alt="Card 6"></div>
        <div class="card card-7"><img src="card-img/07.png" alt="Card 7"></div>
        <div class="card card-8"><img src="card-img/08.png" alt="Card 8"></div>

        <!-- MAN CHARACTER - Center -->
        <div class="man-wrapper">
            <img src="man.png" alt="Man Character" class="man-character">
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
